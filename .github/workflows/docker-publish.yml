name: Build and Publish Code-Location Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  supply-chain:
    name: Supply chain
    uses: ./.github/workflows/supply-chain.yml
    secrets: inherit

  build-and-push:
    needs: supply-chain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One gRPC code-location image per data subject, plus the cross-subject
        # silver and gold layers.
        subject: [whoop, garmin, lingo, soil, silver, gold]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.subject }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.subject }}-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/${{ matrix.subject }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.subject }}
          cache-to: type=gha,mode=max,scope=${{ matrix.subject }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.subject }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.subject }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.subject }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.subject }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
