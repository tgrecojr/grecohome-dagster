[project]
name = "grecohome-silver"
version = "0.1.0"
description = "Silver layer: cross-subject derived/rebuildable Dagster code location (Parquet over bronze)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "grecohome-core",
    "dagster==1.13.31",
    # DuckDB is silver's transform + Parquet engine.
    "duckdb==2.0.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "python-json-logger==4.2.0",
    "python-dotenv==1.2.4",
    "tzdata>=2026.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grecohome_silver"]
