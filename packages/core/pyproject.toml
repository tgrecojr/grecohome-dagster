[project]
name = "grecohome-core"
version = "0.1.0"
description = "Shared library for the grecohome silver and gold code locations (check helpers, silver helpers)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "dagster==1.13.31",
    # Lets a run worker (DefaultRunLauncher runs execute inside the code-location
    # container) write to the host instance's Postgres event/run/schedule storage.
    # It ships psycopg2 only, so the host dagster.yaml must pin
    # `scheme: postgresql+psycopg2`. SQLAlchemy 2.1's default is psycopg v3.
    # See tests/test_instance_storage.py.
    "dagster-postgres==0.29.31",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "python-json-logger==4.2.0",
    "python-dotenv==1.2.4",
    "tzdata>=2026.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grecohome_core"]
